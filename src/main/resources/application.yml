spring:
  application:
    name: api-springboot-corebank

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corebank}
    username: ${DB_USERNAME:corebank}
    password: ${DB_PASSWORD:corebank}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  cache:
    account-balance-ttl: 5s

logging:
  level:
    com.corebank.apispringbootcorebank.infrastructure.cache: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE